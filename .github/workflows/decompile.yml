name: decompile

on:
  workflow_dispatch:
    inputs:
      target:
        description: "仓库内待分析文件路径（留空=自动取 samples/ 第一个）"
        required: false
        default: ""
  push:
    paths:
      - "samples/**"

jobs:
  ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 下载 Ghidra（最新版）
        run: |
          set -e
          URL=$(curl -s https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
                | jq -r '.assets[] | select(.name|endswith(".zip")) | .browser_download_url' | head -1)
          echo "Ghidra: $URL"
          curl -sL "$URL" -o /tmp/ghidra.zip
          unzip -q /tmp/ghidra.zip -d "$HOME"
          ls -d "$HOME"/ghidra_*_PUBLIC

      - name: 反编译全部函数
        run: |
          set -e
          GH=$(ls -d "$HOME"/ghidra_*_PUBLIC | head -1)
          TARGET="${{ inputs.target }}"
          if [ -z "$TARGET" ]; then TARGET=$(git ls-files samples | head -1); fi
          echo "目标: $TARGET"
          export DECOMP_OUT="$PWD/decompiled.c"
          "$GH/support/analyzeHeadless" "$PWD/proj" p1 \
            -import "$TARGET" \
            -scriptPath "$PWD/scripts" \
            -postScript DecompileAll.java \
            -deleteProject
          ls -l decompiled.c
          head -40 decompiled.c

      - uses: actions/upload-artifact@v4
        with:
          name: decompiled-c
          path: decompiled.c
          if-no-files-found: error
